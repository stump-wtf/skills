# pytest Configuration
#
# Two test surfaces: the linters in tools/, and whatever Python a skill bundles
# under skills/<name>/scripts/. Both are listed in testpaths so a bare `pytest`
# at the repo root does exactly what CI does.
#
# python_files carries both patterns. This repo's convention is foo_test.py for
# foo.py -- pytest's own default only matches test_*.py, so a file named the
# house way would be silently skipped without this line. That silence is the
# whole reason it is spelled out.
#
# empty_parameter_set_mark is set to fail_at_collect, NOT to `fail`. `fail` is
# not a legal value and aborts collection for the entire run with an
# INTERNALERROR, taking every suite in the repo with it (verified on pytest
# 8.4.2 and 9.0.2). The point of setting it at all is that a parametrized test
# which collects zero cases otherwise reports as a green SKIP, which is how a
# vacuous guard passes review.
#
# @joestump-agent 08/30/2026 - Initial version.

[pytest]
testpaths = tools skills
python_files = *_test.py test_*.py
addopts = --strict-markers
empty_parameter_set_mark = fail_at_collect
